[WEATHERS]
// These options control which weathers get volumetric shafts.
ExtraSunny = 0
Sunny      = 0
SunnyWindy = 0
Cloudy     = 0
Rain       = 1
Drizzle    = 1
Foggy      = 1
Lightning  = 1

[SPOTLIGHTS]
// These options control the volumetric shaft intensity and scale respectively, per-weather, for all affected spotlights.
// Threshold: [0.0 | 1.5]
SpotlightsVolumeIntensityExtraSunny = 0.0
SpotlightsVolumeIntensitySunny      = 0.0
SpotlightsVolumeIntensitySunnyWindy = 0.0
SpotlightsVolumeIntensityCloudy     = 0.0
SpotlightsVolumeIntensityRain       = 1.15
SpotlightsVolumeIntensityDrizzle    = 1.1
SpotlightsVolumeIntensityFoggy      = 1.3
SpotlightsVolumeIntensityLightning  = 1.2

// Threshold: [0.0 | 0.5]
SpotlightsVolumeScaleExtraSunny = 0.0
SpotlightsVolumeScaleSunny      = 0.0
SpotlightsVolumeScaleSunnyWindy = 0.0
SpotlightsVolumeScaleCloudy     = 0.0
SpotlightsVolumeScaleRain       = 0.15
SpotlightsVolumeScaleDrizzle    = 0.1
SpotlightsVolumeScaleFoggy      = 0.3
SpotlightsVolumeScaleLightning  = 0.2

[POINTLIGHTS]
// These options control the volumetric shaft intensity and scale respectively, per-weather, for all affected pointlights.
// Threshold: [0.0 | 1.5]
PointlightsVolumeIntensityExtraSunny = 0.0
PointlightsVolumeIntensitySunny      = 0.0
PointlightsVolumeIntensitySunnyWindy = 0.0
PointlightsVolumeIntensityCloudy     = 0.0
PointlightsVolumeIntensityRain       = 1.1
PointlightsVolumeIntensityDrizzle    = 1.075
PointlightsVolumeIntensityFoggy      = 1.15
PointlightsVolumeIntensityLightning  = 1.125

// Threshold: [0.0 | 0.5]
PointlightsVolumeScaleExtraSunny = 0.0
PointlightsVolumeScaleSunny      = 0.0
PointlightsVolumeScaleSunnyWindy = 0.0
PointlightsVolumeScaleCloudy     = 0.0
PointlightsVolumeScaleRain       = 0.1
PointlightsVolumeScaleDrizzle    = 0.075
PointlightsVolumeScaleFoggy      = 0.15
PointlightsVolumeScaleLightning  = 0.125

[VEHICLELIGHTS]
// This option controls whether intact vehicle lights are rendered at their midpoint (0) or at the position of each intact physical bulb (1).
DualVehicleLights = 0

// This option controls whether vehicle lights get volumetric shafts.
// NOTE: Enabling this option requires the above option to be enabled as well.
VolumetricVehicleLights = 0

// These options control the volumetric shaft intensity and scale respectively, per-weather, for all affected vehicle lights.
// Threshold: [0.0 | 1.5]
VehicleLightsVolumeIntensityExtraSunny = 0.0
VehicleLightsVolumeIntensitySunny      = 0.0
VehicleLightsVolumeIntensitySunnyWindy = 0.0
VehicleLightsVolumeIntensityCloudy     = 0.0
VehicleLightsVolumeIntensityRain       = 1.15
VehicleLightsVolumeIntensityDrizzle    = 1.1
VehicleLightsVolumeIntensityFoggy      = 1.3
VehicleLightsVolumeIntensityLightning  = 1.2

// Threshold: [0.0 | 0.5]
VehicleLightsVolumeScaleExtraSunny = 0.0
VehicleLightsVolumeScaleSunny      = 0.0
VehicleLightsVolumeScaleSunnyWindy = 0.0
VehicleLightsVolumeScaleCloudy     = 0.0
VehicleLightsVolumeScaleRain       = 0.1
VehicleLightsVolumeScaleDrizzle    = 0.075
VehicleLightsVolumeScaleFoggy      = 0.15
VehicleLightsVolumeScaleLightning  = 0.125

// These options control the corona size and intensity respectively for vehicle headlights and taillights.
// Threshold: [0.0 | 1.0]
HeadlightsCoronaSize = 0.25
TaillightsCoronaSize = 0.25

HeadlightsCoronaIntensity = 0.1
TaillightsCoronaIntensity = 0.1

[PICKUPLIGHTS]
// This option controls whether pickup lights are disabled (0), same as vanilla (1) or use fill lighting (2, with weaker, less specular highlights).
PickupLightsMode = 1
